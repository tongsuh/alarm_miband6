name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Verify Consistent Release Keystore
        run: |
          echo "Verifying release keystore..."
          if [ -f "app/release.jks" ]; then
            echo "Keystore file exists."
            # Verify if keytool can read the keystore with alias 'flashalarm'
            if ! keytool -list -keystore app/release.jks -storepass flashalarm123 > /dev/null 2>&1; then
              echo "Re-generating standardized Java JKS keystore to guarantee compatibility..."
              rm -f app/release.jks
              keytool -genkeypair -v \
                -keystore app/release.jks \
                -alias flashalarm \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass flashalarm123 \
                -keypass flashalarm123 \
                -dname "CN=FlashAlarm, O=FlashAlarm, C=CN"
            fi
          else
            echo "Creating standardized Java JKS release keystore..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias flashalarm \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass flashalarm123 \
              -keypass flashalarm123 \
              -dname "CN=FlashAlarm, O=FlashAlarm, C=CN"
          fi
          echo "Keystore verified with fingerprint:"
          keytool -list -v -keystore app/release.jks -storepass flashalarm123 | grep -E "SHA1|SHA256|Alias"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found generated APK: $APK_PATH"
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
            if [ -x "$APKSIGNER" ]; then
              $APKSIGNER verify --verbose "$APK_PATH"
            fi
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashAlarm-MiBand6-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Debug APK Artifact
        run: ./gradlew assembleDebug --stacktrace
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashAlarm-MiBand6-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
