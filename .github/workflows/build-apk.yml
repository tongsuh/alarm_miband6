name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Ensure Consistent Release Keystore
        run: |
          echo "Checking release keystore for alias 'flashalarm'..."
          NEED_NEW=0
          if [ ! -f "app/release.jks" ]; then
            NEED_NEW=1
          elif ! keytool -list -keystore app/release.jks -alias flashalarm -storepass flashalarm123 > /dev/null 2>&1; then
            echo "Keystore exists but does not contain alias 'flashalarm'. Regenerating..."
            NEED_NEW=1
          fi

          if [ "$NEED_NEW" -eq 1 ]; then
            rm -f app/release.jks
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias flashalarm \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass flashalarm123 \
              -keypass flashalarm123 \
              -dname "CN=FlashAlarm, O=FlashAlarm, C=CN"
            
            # Persist back to repository so every subsequent build uses this exact keystore
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add app/release.jks
              git commit -m "chore: persist unified release keystore for consistent future signing [skip ci]" || true
              git push origin main || true
            fi
          fi

          echo "Keystore verified with fingerprint:"
          keytool -list -v -keystore app/release.jks -alias flashalarm -storepass flashalarm123 | grep -E "SHA1|SHA256|Alias"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Signatures
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Release APK: $RELEASE_APK"
          echo "Debug APK: $DEBUG_APK"
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
            if [ -x "$APKSIGNER" ]; then
              echo "--- Release APK Signing Info ---"
              $APKSIGNER verify --verbose "$RELEASE_APK"
              echo "--- Debug APK Signing Info ---"
              $APKSIGNER verify --verbose "$DEBUG_APK"
            fi
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashAlarm-MiBand6-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashAlarm-MiBand6-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
